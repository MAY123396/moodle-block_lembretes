name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Um critério por linha vira um check-run separado (nota granular no mod_codereview).
        # Edite conforme o que você quer avaliar. 'behat' precisa de .feature e é pesado;
        # 'phpmd' é ruidoso para iniciantes.
        criterion: [phplint, phpcs, phpdoc, savepoints, mustache, grunt, phpunit]
    name: ${{ matrix.criterion }}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: root
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with: { path: plugin }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, mysqli, gd, zip, soap, intl
          ini-values: max_input_vars=5000
          coverage: none
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Instalar moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Instalar ambiente
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_502_STABLE
      - name: ${{ matrix.criterion }}
        run: |
          case "${{ matrix.criterion }}" in
            phpcs)   moodle-plugin-ci phpcs --max-warnings 0 ;;
            phpdoc)  moodle-plugin-ci phpdoc --max-warnings 0 ;;
            grunt)   moodle-plugin-ci grunt --max-lint-warnings 0 ;;
            behat)   moodle-plugin-ci behat --profile chrome ;;
            *)       moodle-plugin-ci ${{ matrix.criterion }} ;;
          esac
# 'validate' foi deixado de fora: quebra sob PHP 8.3 no CI (nikic/php-parser), e o
# Moodle 5.2 exige 8.3. Adicione um job próprio depois se quiser esse critério.
